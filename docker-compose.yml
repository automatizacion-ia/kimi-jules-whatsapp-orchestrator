services:
  orchestrator:
    build: .
    container_name: kimi-jules-whatsapp-orchestrator
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEBHOOK_PORT:-3000}:${WEBHOOK_PORT:-3000}"
    volumes:
      - orchestrator-data:/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  orchestrator-data:
